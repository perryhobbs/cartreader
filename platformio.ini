; PlatformIO Project Configuration File

[platformio]
src_dir = Cart_Reader

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
upload_port = /dev/cu.usbserial*
monitor_port = /dev/cu.usbserial*
lib_deps =
    greiman/SdFat
    etherkit/Etherkit Si5351
    olikraus/U8g2
    mathertel/RotaryEncoder
    adafruit/Adafruit NeoPixel
    adafruit/RTClib
